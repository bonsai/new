name: Update Feed

on:
  push:
    branches: [gh-pages]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Generate log.jsonl from GitHub activity
        run: |
          gh api "repos/bonsai/sync-repos/events?per_page=30" \
            --jq '.[] | select(.type=="PushEvent" or .type=="DeleteEvent" or .type=="CreateEvent") | {type: .type, actor: .actor.login, repo: .repo.name, ts: .created_at}' \
            > /tmp/events.jsonl
          python3 << 'PYEOF'
          import json
          with open('/tmp/events.jsonl') as fin, open('log.jsonl', 'w') as fout:
              count = 0
              for line in fin:
                  line = line.strip()
                  if not line:
                      continue
                  r = json.loads(line)
                  fout.write(json.dumps({'timestamp': r['ts'], 'event': r['type'], 'agent': r['actor'], 'repo': r['repo']}) + '\n')
                  count += 1
              print(f'Generated {count} activity events')
          PYEOF
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update: feed + log from GH activity $(date -u +%Y-%m-%dT%H:%M)" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}