<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sync-repos — live terminal</title>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; overflow: hidden; }
#terminal { width: 100vw; height: calc(100vh - 28px); padding: 4px; }
#statusbar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
  background: #161b22; border-top: 1px solid #30363d;
  display: flex; align-items: center; padding: 0 12px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 12px; color: #8b949e; gap: 16px;
}
#statusbar .label { color: #58a6ff; }
#statusbar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
#statusbar .dot-green { background: #3fb950; animation: pulse 2s infinite; }
#statusbar .dot-yellow { background: #d29922; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
#statusbar .sep { color: #30363d; }
</style>
</head>
<body>
<div id="terminal"></div>
<div id="statusbar">
  <span><span class="dot dot-green"></span><span class="label">runner</span> github-actions</span>
  <span class="sep">│</span>
  <span><span class="label">workflow</span> update-feed.yml</span>
  <span class="sep">│</span>
  <span><span class="label">trigger</span> <span id="trigger">schedule</span></span>
  <span class="sep">│</span>
  <span><span class="label">repo</span> bonsai/new</span>
  <span class="sep">│</span>
  <span><span class="label">branch</span> gh-pages</span>
  <span class="sep">│</span>
  <span><span class="label">last run</span> <span id="lastrun">—</span></span>
  <span class="sep">│</span>
  <span><span class="label">next</span> <span id="nextrun">—</span></span>
</div>
<script>
const term = new Terminal({
  fontSize: 13,
  fontFamily: 'Consolas, "Courier New", monospace',
  theme: { background: '#0d1117', foreground: '#c9d1d9', cursor: '#58a6ff' },
  cursorBlink: true,
  rows: 50,
  scrollback: 10000
});
term.open(document.getElementById('terminal'));

const fit = () => {
  try {
    const d = term._core._renderService.dimensions;
    term.resize(
      Math.floor(d.css.container.width / d.css.cell.width),
      Math.floor(d.css.container.height / d.css.cell.height)
    );
  } catch(e) {}
};
window.addEventListener('resize', fit);
setTimeout(fit, 50);

// --- helpers ---
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function typeLine(text) {
  for (const ch of text) { term.write(ch); await sleep(5 + Math.random() * 8); }
  term.write('\r\n');
}
function green(s)  { return '\x1b[32m' + s + '\x1b[0m'; }
function blue(s)   { return '\x1b[34m' + s + '\x1b[0m'; }
function yellow(s) { return '\x1b[33m' + s + '\x1b[0m'; }
function dim(s)    { return '\x1b[2m' + s + '\x1b[0m'; }
function cyan(s)   { return '\x1b[36m' + s + '\x1b[0m'; }
function red(s)    { return '\x1b[31m' + s + '\x1b[0m'; }
function magenta(s){ return '\x1b[35m' + s + '\x1b[0m'; }
function bold(s)   { return '\x1b[1m' + s + '\x1b[0m'; }
function autoScroll() { term.scrollToBottom(); }

// --- data ---
let repos = [];
let activities = [];
let scope = {};

async function loadScope() {
  scope = {
    source: 'repos.sqlite → data.jsonl',
    fields: ['folder_name', 'github_url', 'diff_status', 'similarity_score', 'deleted_at'],
    filters: ['identical', 'local_ahead', 'remote_ahead', 'diverged', 'no_remote'],
    agents: ['hoto', 'mito', 'opencode', 'hermes'],
    runner: {
      vm: 'GitHub Actions (Ubuntu Latest)',
      os: 'Linux x64',
      shell: 'bash',
      workflow: 'update-feed.yml',
      trigger: 'schedule (*/30 * * * *) + push + manual',
      repo: 'bonsai/new',
      branch: 'gh-pages',
      scope: 'data.jsonl + log.jsonl のみ',
      'repos.sqlite直接参照': 'しない（GH Pages配信経由）'
    }
  };
}

async function fetchData() {
  try {
    const r1 = await fetch('./data.jsonl?t=' + Date.now());
    const t1 = await r1.text();
    repos = t1.trim().split('\n').filter(Boolean).map(JSON.parse);
  } catch(e) { repos = []; }
  try {
    const r2 = await fetch('./log.jsonl?t=' + Date.now());
    const t2 = await r2.text();
    activities = t2.trim().split('\n').filter(Boolean).map(JSON.parse);
  } catch(e) { activities = []; }
}

// --- boot ---
async function boot() {
  term.clear();
  await typeLine('  🌿  sync-repos  ──  live terminal v2', magenta);
  await typeLine('  ───────────────────────────────────────────────', dim);
  await sleep(200);

  await typeLine('  ' + dim('runner:') + '  github-actions (ubuntu-latest)');
  await typeLine('  ' + dim('workflow:') + ' update-feed.yml');
  await typeLine('  ' + dim('trigger:') + '  schedule */30, push, manual');
  await typeLine('  ' + dim('repo:') + '    bonsai/new (gh-pages)');
  await typeLine('  ' + dim('scope:') + '    data.jsonl + log.jsonl only');
  await sleep(300);

  await typeLine('  $ ' + green('init --scope'));
  await loadScope();
  await sleep(200);
  await typeLine('  ✓ scope loaded: ' + cyan(scope.fields.length) + ' fields, ' + cyan(scope.agents.length) + ' agents');
  await sleep(200);

  await typeLine('  $ ' + green('fetch data.jsonl && log.jsonl'));
  await fetchData();
  await sleep(300);
  await typeLine('  ✓ repos: ' + green(String(repos.length)) + ' entries');
  await typeLine('  ✓ activity: ' + cyan(String(activities.length)) + ' events');
  await sleep(200);

  // whoami
  await typeLine('  $ ' + green('whoami'));
  await typeLine('  → runner: github-actions │ vm: ubuntu-latest │ shell: bash');
  await typeLine('  → executing: update-feed.yml → log.jsonl generator');
  await sleep(300);

  term.writeln('');
  await typeLine('  commands: ' + green('[s]') + ' scope  ' + green('[r]') + ' repos  ' + green('[a]') + ' activity  ' + green('[d]') + ' dashboard  ' + green('[w]') + ' whoami  ' + green('[q]') + ' quit');
  term.writeln('');

  // update status bar
  document.getElementById('lastrun').textContent = new Date().toLocaleTimeString();
  const next30 = new Date(Date.now() + 30 * 60000);
  document.getElementById('nextrun').textContent = next30.toLocaleTimeString();

  startRandomTasks();
}

// --- random tasks (GH Actions VM が実行している風) ---
const taskNames = [
  'scan_repos', 'calc_similarity', 'judge_deletable', 'verify_push',
  'fetch_gh_events', 'report_diff', 'sync_db', 'check_rate_limit',
  'inventory_check', 'privacy_scan', 'naming_verify', 'backup_hormon'
];
const agents = ['hoto', 'mito', 'opencode', 'hermes'];

async function randomTask() {
  const task = taskNames[Math.floor(Math.random() * taskNames.length)];
  const agent = agents[Math.floor(Math.random() * agents.length)];
  const ts = new Date().toISOString().slice(11, 19);

  term.write('  ' + dim(ts) + ' ');
  term.write(cyan('[' + agent + ']'));
  term.write(' $ ' + task);
  term.writeln('');
  autoScroll();

  const lines = 2 + Math.floor(Math.random() * 5);
  for (let i = 0; i < lines; i++) {
    await sleep(80 + Math.random() * 200);
    const outputs = [
      () => '  ├─ scanning... ' + green('✓'),
      () => '  ├─ diff: ' + cyan(String(Math.floor(Math.random() * 50))) + ' files changed',
      () => '  ├─ similarity: ' + yellow((Math.random() * 100).toFixed(1) + '%'),
      () => '  ├─ status: ' + green('identical'),
      () => '  ├─ repo: ' + blue('bonsai/' + (repos[Math.floor(Math.random() * repos.length)]?.github_name || 'unknown')),
      () => '  ├─ agent: ' + magenta(agent) + ' → ' + dim('next: ' + agents[Math.floor(Math.random() * agents.length)]),
      () => '  ├─ db: ' + (Math.random() > 0.5 ? green('updated') : dim('no changes')),
      () => '  ├─ confidence: ' + (Math.random() > 0.7 ? green((80 + Math.random() * 20).toFixed(0) + '%') : dim('—')),
      () => '  └─ ' + (Math.random() > 0.3 ? green('done') : yellow('partial')),
    ];
    await typeLine(outputs[Math.floor(Math.random() * outputs.length)]());
    autoScroll();
  }
  autoScroll();
}

function startRandomTasks() {
  const schedule = () => {
    const delay = 1500 + Math.random() * 4000;
    setTimeout(async () => {
      await randomTask();
      schedule();
    }, delay);
  };
  schedule();
}

// --- views ---
async function showScope() {
  term.writeln('');
  await typeLine('  ── scope (from DB) ──', magenta);
  term.writeln('');
  await typeLine('  source:      ' + yellow(scope.source));
  await typeLine('  fields:      ' + scope.fields.map(f => cyan(f)).join(', '));
  await typeLine('  filters:     ' + scope.filters.map(f => green(f)).join(', '));
  await typeLine('  agents:      ' + scope.agents.map(a => cyan(a)).join(', '));
  term.writeln('');
  await typeLine('  ' + bold('runner'), magenta);
  await typeLine('  vm:          ' + yellow(scope.runner.vm));
  await typeLine('  os:          ' + dim(scope.runner.os));
  await typeLine('  shell:       ' + dim(scope.runner.shell));
  await typeLine('  workflow:    ' + cyan(scope.runner.workflow));
  await typeLine('  trigger:     ' + dim(scope.runner.trigger));
  await typeLine('  repo:        ' + blue(scope.runner.repo));
  await typeLine('  branch:      ' + dim(scope.runner.branch));
  await typeLine('  scope:       ' + yellow(scope.runner.scope));
  await typeLine('  repos.sqlite: ' + red(scope.runner['repos.sqlite直接参照']));
  term.writeln('');
  autoScroll();
}

async function showRepos() {
  term.writeln('');
  await typeLine('  ── repos (' + repos.length + ') ──', magenta);
  term.writeln('');
  const show = repos.slice(0, 15);
  for (const r of show) {
    const score = r.similarity_score ? (r.similarity_score * 100).toFixed(0) + '%' : '—';
    await typeLine(
      '  ' + green(r.folder_name.padEnd(24)) +
      blue(r.github_url.replace('https://github.com/', '').padEnd(24)) +
      yellow(score)
    );
  }
  if (repos.length > 15) await typeLine(dim('  ... ' + (repos.length - 15) + ' more'));
  term.writeln('');
  await typeLine('  total: ' + green(String(repos.length)) + ' deleted from local');
  term.writeln('');
  autoScroll();
}

async function showActivity() {
  term.writeln('');
  await typeLine('  ── activity (' + activities.length + ') ──', magenta);
  term.writeln('');
  const recent = activities.slice(-10);
  for (const a of recent) {
    const ts = (a.timestamp || '').slice(11, 19) || '--:--:--';
    await typeLine('  ' + dim(ts) + '  ' + cyan((a.agent || '?').padEnd(8)) + ' ' + green(a.event || a.message || 'unknown'));
  }
  if (activities.length === 0) await typeLine(dim('  no activity — workflow will populate log.jsonl'));
  term.writeln('');
  autoScroll();
}

async function showDashboard() {
  term.writeln('');
  await typeLine('  ── dashboard ──', magenta);
  term.writeln('');
  const identical = repos.filter(r => r.diff_status === 'identical').length;
  const ahead = repos.filter(r => r.diff_status === 'local_ahead').length;
  const diverged = repos.filter(r => r.diff_status === 'diverged').length;
  const rate = repos.length > 0 ? (identical / repos.length * 100).toFixed(0) : 0;
  await typeLine('  synced repos:    ' + green(String(identical)) + ' / ' + repos.length + ' (' + yellow(rate + '%') + ')');
  await typeLine('  local ahead:     ' + yellow(String(ahead)));
  await typeLine('  diverged:        ' + red(String(diverged)));
  await typeLine('  activity events: ' + cyan(String(activities.length)));
  term.writeln('');
  const bar = (label, val, max, color) => {
    const w = 30;
    const filled = max > 0 ? Math.round(val / max * w) : 0;
    return '  ' + label.padEnd(14) + color('█'.repeat(filled)) + dim('░'.repeat(w - filled)) + ' ' + val;
  };
  const maxVal = Math.max(identical, ahead, diverged, 1);
  await typeLine(bar('identical', identical, maxVal, green));
  await typeLine(bar('local_ahead', ahead, maxVal, yellow));
  await typeLine(bar('diverged', diverged, maxVal, red));
  term.writeln('');
  await typeLine('  latest deletion: ' + (repos[repos.length - 1]?.folder_name || '—'));
  await typeLine('  last activity:  ' + (activities[activities.length - 1]?.timestamp || '—'));
  term.writeln('');
  autoScroll();
}

async function showWhoami() {
  term.writeln('');
  await typeLine('  ── whoami ──', magenta);
  term.writeln('');
  await typeLine('  runner:    ' + green('github-actions'));
  await typeLine('  vm:        ' + yellow('ubuntu-latest (linux x64)'));
  await typeLine('  shell:     ' + dim('bash'));
  await typeLine('  workflow:  ' + cyan('update-feed.yml'));
  await typeLine('  trigger:   ' + dim('schedule */30 * * * *'));
  await typeLine('  repo:      ' + blue('bonsai/new'));
  await typeLine('  branch:    ' + dim('gh-pages'));
  await typeLine('  scope:     ' + yellow('data.jsonl + log.jsonl'));
  await typeLine('  storage:   ' + dim('GH Pages (static)'));
  term.writeln('');
  await typeLine('  this terminal is driven by GH Actions VM');
  await typeLine('  data flows: repos.sqlite → data.jsonl → GH Pages → browser');
  term.writeln('');
  autoScroll();
}

// --- interactive ---
let inputBuf = '';
let commandMode = false;

term.onData(async (data) => {
  if (commandMode) return;
  const code = data.charCodeAt(0);
  if (code === 13) {
    commandMode = true;
    term.writeln('');
    const cmd = inputBuf.trim();
    inputBuf = '';
    if (cmd === 's' || cmd === 'scope') await showScope();
    else if (cmd === 'r' || cmd === 'repos') await showRepos();
    else if (cmd === 'a' || cmd === 'activity') await showActivity();
    else if (cmd === 'd' || cmd === 'dashboard') await showDashboard();
    else if (cmd === 'w' || cmd === 'whoami') await showWhoami();
    else if (cmd === 'q' || cmd === 'quit') { await typeLine('  👋 bye', magenta); term.dispose(); return; }
    else if (cmd === 'clear' || cmd === 'c') term.clear();
    else if (cmd === 'help' || cmd === 'h') await typeLine('  [s]scope [r]repos [a]activity [d]dashboard [w]whoami [c]clear [q]quit');
    else if (cmd) await typeLine('  unknown: ' + cmd + '  (h for help)', red);
    term.write('  $ ');
    commandMode = false;
  } else if (code === 127) {
    if (inputBuf.length > 0) { inputBuf = inputBuf.slice(0, -1); term.write('\x1b[1D \x1b[1D'); }
  } else if (code >= 32 && code < 127) { inputBuf += data; term.write(data); }
});

setInterval(async () => { await fetchData(); }, 30000);

term.write('  $ ');
boot();
</script>
</body>
</html>
