<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sync-repos — WSL Ubuntu</title>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2d2d2d; overflow: hidden; font-family: 'Segoe UI', -apple-system, sans-serif; user-select: none; }

/* --- Title Bar --- */
#titlebar {
  height: 32px; background: #3c3c3c;
  display: flex; align-items: center; padding: 0 12px;
  -webkit-app-region: drag; cursor: default;
}
#titlebar .icon { color: #cccccc; font-size: 14px; margin-right: 8px; }
#titlebar .title { color: #cccccc; font-size: 12px; flex: 1; }
#titlebar .controls { display: flex; gap: 0; -webkit-app-region: no-drag; }
#titlebar .controls div {
  width: 46px; height: 32px; display: flex; align-items: center; justify-content: center;
  color: #cccccc; font-size: 10px; cursor: pointer;
}
#titlebar .controls div:hover { background: #505050; }
#titlebar .controls .close:hover { background: #e81123; }

/* --- Tab Bar --- */
#tabbar {
  display: flex; background: #2d2d2d; padding: 0 8px;
  overflow-x: auto; scrollbar-width: none;
}
#tabbar::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; color: #cccccc; font-size: 12px;
  background: #2d2d2d; border: none; cursor: pointer;
  border-right: 1px solid #3c3c3c;
  max-width: 200px; min-width: 100px;
  transition: background 0.15s;
}
.tab:hover { background: #3c3c3c; }
.tab.active { background: #0d1117; color: #ffffff; }
.tab .tab-icon { font-size: 14px; }
.tab .tab-close {
  width: 18px; height: 18px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; opacity: 0; transition: opacity 0.15s;
}
.tab:hover .tab-close { opacity: 0.7; }
.tab .tab-close:hover { background: #505050; opacity: 1; }
.tab-add {
  width: 28px; height: 28px; margin: 4px;
  display: flex; align-items: center; justify-content: center;
  color: #888; font-size: 16px; cursor: pointer; border-radius: 4px;
}
.tab-add:hover { background: #3c3c3c; color: #ccc; }

/* --- Toolbar --- */
#toolbar {
  height: 36px; background: #252526; border-bottom: 1px solid #3c3c3c;
  display: flex; align-items: center; padding: 0 12px; gap: 8px;
}
#toolbar .btn {
  padding: 4px 10px; font-size: 11px; color: #cccccc;
  background: #3c3c3c; border: 1px solid #555; border-radius: 3px;
  cursor: pointer;
}
#toolbar .btn:hover { background: #505050; }
#toolbar .btn.active { background: #094771; border-color: #007acc; }
#toolbar .sep { width: 1px; height: 20px; background: #555; margin: 0 4px; }
#toolbar .spacer { flex: 1; }
#toolbar .cwd { color: #888; font-size: 11px; font-family: Consolas, monospace; }

/* --- Terminal --- */
#terminal-container { display: flex; height: calc(100vh - 32px - 36px - 36px); }
#terminal { flex: 1; padding: 4px 8px; }

/* --- Status Bar --- */
#statusbar {
  height: 24px; background: #007acc;
  display: flex; align-items: center; padding: 0 12px;
  font-size: 11px; color: #ffffff; gap: 16px;
}
#statusbar .item { display: flex; align-items: center; gap: 4px; }
#statusbar .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ec9b0; }
#statusbar .remote { background: #3c3c3c; padding: 1px 8px; border-radius: 3px; }
</style>
</head>
<body>

<!-- Title Bar -->
<div id="titlebar">
  <span class="icon">⌘</span>
  <span class="title">sync-repos — WSL Ubuntu (bonsai/new)</span>
  <div class="controls">
    <div onclick="this.style.parentElement.style.display='none'">─</div>
    <div>□</div>
    <div class="close">✕</div>
  </div>
</div>

<!-- Tab Bar -->
<div id="tabbar">
  <button class="tab active" data-tab="main">
    <span class="tab-icon">⌘</span>
    <span>wsl — sync-repos</span>
    <span class="tab-close">✕</span>
  </button>
  <button class="tab" data-tab="second">
    <span class="tab-icon">⌘</span>
    <span>wsl — activity</span>
    <span class="tab-close">✕</span>
  </button>
  <div class="tab-add" title="new tab">+</div>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <button class="btn" data-cmd="scope">scope</button>
  <button class="btn" data-cmd="repos">repos</button>
  <button class="btn" data-cmd="activity">activity</button>
  <button class="btn" data-cmd="dashboard">dashboard</button>
  <button class="btn" data-cmd="whoami">whoami</button>
  <div class="sep"></div>
  <button class="btn" data-cmd="clear">clear</button>
  <div class="spacer"></div>
  <span class="cwd">~/sync-repos</span>
</div>

<!-- Terminal -->
<div id="terminal-container">
  <div id="terminal"></div>
</div>

<!-- Status Bar -->
<div id="statusbar">
  <div class="item"><span class="dot"></span> connected</div>
  <div class="item remote">🐧 WSL Ubuntu 22.04</div>
  <div class="item">main</div>
  <div class="item">LF</div>
  <div class="item">UTF-8</div>
  <div class="item">github-actions/vm</div>
</div>

<script>
// --- Terminal ---
const term = new Terminal({
  fontSize: 13,
  fontFamily: 'Consolas, "Cascadia Code", "Courier New", monospace',
  theme: { background: '#0d1117', foreground: '#d4d4d4', cursor: '#ffffff' },
  cursorBlink: true,
  cursorStyle: 'bar',
  rows: 40,
  scrollback: 50000
});
term.open(document.getElementById('terminal'));

const fit = () => {
  try {
    const c = term._core._renderService.dimensions;
    term.resize(
      Math.floor(c.css.container.width / c.css.cell.width),
      Math.floor(c.css.container.height / c.css.cell.height)
    );
  } catch(e) {}
};
window.addEventListener('resize', fit);
setInterval(fit, 200);

// --- helpers ---
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function typeLine(text) {
  for (const ch of text) { term.write(ch); await sleep(3 + Math.random() * 6); }
  term.write('\r\n');
}
function green(s)  { return '\x1b[32m' + s + '\x1b[0m'; }
function blue(s)   { return '\x1b[34m' + s + '\x1b[0m'; }
function yellow(s) { return '\x1b[33m' + s + '\x1b[0m'; }
function dim(s)    { return '\x1b[2m' + s + '\x1b[0m'; }
function cyan(s)   { return '\x1b[36m' + s + '\x1b[0m'; }
function red(s)    { return '\x1b[31m' + s + '\x1b[0m'; }
function magenta(s){ return '\x1b[35m' + s + '\x1b[0m'; }
function bold(s)   { return '\x1b[1m' + s + '\x1b[0m'; }
function autoScroll() { term.scrollToBottom(); }

// --- data ---
let repos = [];
let activities = [];
let scope = {};

async function loadScope() {
  scope = {
    source: 'repos.sqlite → data.jsonl',
    fields: ['folder_name', 'github_url', 'diff_status', 'similarity_score', 'deleted_at'],
    filters: ['identical', 'local_ahead', 'remote_ahead', 'diverged', 'no_remote'],
    agents: ['hoto', 'mito', 'opencode', 'hermes'],
    runner: {
      vm: 'GitHub Actions (Ubuntu Latest)',
      os: 'Linux x64',
      shell: 'bash',
      workflow: 'update-feed.yml',
      trigger: 'schedule */30 + push + manual',
      repo: 'bonsai/new',
      branch: 'gh-pages',
      scope: 'data.jsonl + log.jsonl only',
      repos_sqlite: 'not direct (via GH Pages)'
    }
  };
}

async function fetchData() {
  try {
    const r1 = await fetch('./data.jsonl?t=' + Date.now());
    repos = (await r1.text()).trim().split('\n').filter(Boolean).map(JSON.parse);
  } catch(e) { repos = []; }
  try {
    const r2 = await fetch('./log.jsonl?t=' + Date.now());
    activities = (await r2.text()).trim().split('\n').filter(Boolean).map(JSON.parse);
  } catch(e) { activities = []; }
}

// --- boot ---
async function boot() {
  term.clear();
  await typeLine('Welcome to Ubuntu 22.04.3 LTS (GNU/Linux 5.15.90.1-microsoft-standard-WSL2 x86_64)', dim);
  term.writeln('');
  await typeLine(' * Documentation:  https://help.ubuntu.com', dim);
  await typeLine(' * Management:     https://landscape.canonical.com', dim);
  await typeLine(' * Support:        https://ubuntu.com/advantage', dim);
  term.writeln('');
  await typeLine('  System information as of ' + new Date().toString(), dim);
  term.writeln('');
  await typeLine('  System load:  0.08              Processes:               142');
  await typeLine('  Usage of /:   12.4% of 250.98GB   Users logged in:         1');
  await typeLine('  Memory usage: 23%               IPv4 address for eth0:   172.x.x.x');
  await typeLine('  Swap usage:   0%');
  term.writeln('');
  await typeLine('  🌿  sync-repos  ──  live terminal v3', magenta);
  await typeLine('  ──────────────────────────────────────────────────', dim);
  await sleep(200);
  await typeLine('  runner:  github-actions (ubuntu-latest)');
  await typeLine('  workflow: update-feed.yml');
  await typeLine('  repo:    bonsai/new (gh-pages)');
  await typeLine('  scope:   data.jsonl + log.jsonl only');
  await sleep(300);
  await typeLine('  $ ' + green('init --scope'));
  await loadScope();
  await typeLine('  ✓ scope loaded: ' + cyan(scope.fields.length) + ' fields, ' + cyan(scope.agents.length) + ' agents');
  await sleep(200);
  await typeLine('  $ ' + green('fetch data.jsonl && log.jsonl'));
  await fetchData();
  await sleep(300);
  await typeLine('  ✓ repos: ' + green(String(repos.length)) + ' entries');
  await typeLine('  ✓ activity: ' + cyan(String(activities.length)) + ' events');
  await sleep(200);
  await typeLine('  $ ' + green('whoami'));
  await typeLine('  → runner: github-actions │ vm: ubuntu-latest │ shell: bash');
  await typeLine('  → executing: update-feed.yml → log.jsonl generator');
  await sleep(300);
  term.writeln('');
  await typeLine('  commands: ' + green('[s]') + ' scope  ' + green('[r]') + ' repos  ' + green('[a]') + ' activity  ' + green('[d]') + ' dashboard  ' + green('[w]') + ' whoami  ' + green('[q]') + ' quit');
  term.writeln('');
  startRandomTasks();
}

// --- random tasks ---
const taskNames = [
  'scan_repos', 'calc_similarity', 'judge_deletable', 'verify_push',
  'fetch_gh_events', 'report_diff', 'sync_db', 'check_rate_limit',
  'inventory_check', 'privacy_scan', 'naming_verify', 'backup_hormon'
];
const agents = ['hoto', 'mito', 'opencode', 'hermes'];

async function randomTask() {
  const task = taskNames[Math.floor(Math.random() * taskNames.length)];
  const agent = agents[Math.floor(Math.random() * agents.length)];
  const ts = new Date().toISOString().slice(11, 19);
  term.write('  ' + dim(ts) + ' ');
  term.write(cyan('[' + agent + ']'));
  term.write(' $ ' + task);
  term.writeln('');
  autoScroll();
  const lines = 2 + Math.floor(Math.random() * 5);
  for (let i = 0; i < lines; i++) {
    await sleep(80 + Math.random() * 200);
    const outputs = [
      () => '  ├─ scanning... ' + green('✓'),
      () => '  ├─ diff: ' + cyan(String(Math.floor(Math.random() * 50))) + ' files changed',
      () => '  ├─ similarity: ' + yellow((Math.random() * 100).toFixed(1) + '%'),
      () => '  ├─ status: ' + green('identical'),
      () => '  ├─ repo: ' + blue('bonsai/' + (repos[Math.floor(Math.random() * repos.length)]?.github_name || 'unknown')),
      () => '  ├─ agent: ' + magenta(agent) + ' → ' + dim('next: ' + agents[Math.floor(Math.random() * agents.length)]),
      () => '  ├─ db: ' + (Math.random() > 0.5 ? green('updated') : dim('no changes')),
      () => '  ├─ confidence: ' + (Math.random() > 0.7 ? green((80 + Math.random() * 20).toFixed(0) + '%') : dim('—')),
      () => '  └─ ' + (Math.random() > 0.3 ? green('done') : yellow('partial')),
    ];
    await typeLine(outputs[Math.floor(Math.random() * outputs.length)]());
    autoScroll();
  }
  autoScroll();
}

function startRandomTasks() {
  const schedule = () => {
    setTimeout(async () => { await randomTask(); schedule(); }, 1500 + Math.random() * 4000);
  };
  schedule();
}

// --- views ---
async function showScope() {
  term.writeln('');
  await typeLine('  ── scope (from DB) ──', magenta);
  term.writeln('');
  await typeLine('  source:      ' + yellow(scope.source));
  await typeLine('  fields:      ' + scope.fields.map(f => cyan(f)).join(', '));
  await typeLine('  filters:     ' + scope.filters.map(f => green(f)).join(', '));
  await typeLine('  agents:      ' + scope.agents.map(a => cyan(a)).join(', '));
  term.writeln('');
  await typeLine('  ' + bold('runner'), magenta);
  await typeLine('  vm:          ' + yellow(scope.runner.vm));
  await typeLine('  os:          ' + dim(scope.runner.os));
  await typeLine('  shell:       ' + dim(scope.runner.shell));
  await typeLine('  workflow:    ' + cyan(scope.runner.workflow));
  await typeLine('  trigger:     ' + dim(scope.runner.trigger));
  await typeLine('  repo:        ' + blue(scope.runner.repo));
  await typeLine('  branch:      ' + dim(scope.runner.branch));
  await typeLine('  scope:       ' + yellow(scope.runner.scope));
  await typeLine('  repos.sqlite: ' + red(scope.runner.repos_sqlite));
  term.writeln('');
  autoScroll();
}

async function showRepos() {
  term.writeln('');
  await typeLine('  ── repos (' + repos.length + ') ──', magenta);
  term.writeln('');
  const show = repos.slice(0, 15);
  for (const r of show) {
    const score = r.similarity_score ? (r.similarity_score * 100).toFixed(0) + '%' : '—';
    await typeLine('  ' + green(r.folder_name.padEnd(24)) + blue(r.github_url.replace('https://github.com/', '').padEnd(24)) + yellow(score));
  }
  if (repos.length > 15) await typeLine(dim('  ... ' + (repos.length - 15) + ' more'));
  term.writeln('');
  await typeLine('  total: ' + green(String(repos.length)) + ' deleted from local');
  term.writeln('');
  autoScroll();
}

async function showActivity() {
  term.writeln('');
  await typeLine('  ── activity (' + activities.length + ') ──', magenta);
  term.writeln('');
  const recent = activities.slice(-10);
  for (const a of recent) {
    const ts = (a.timestamp || '').slice(11, 19) || '--:--:--';
    await typeLine('  ' + dim(ts) + '  ' + cyan((a.agent || '?').padEnd(8)) + ' ' + green(a.event || a.message || 'unknown'));
  }
  if (activities.length === 0) await typeLine(dim('  no activity — workflow will populate log.jsonl'));
  term.writeln('');
  autoScroll();
}

async function showDashboard() {
  term.writeln('');
  await typeLine('  ── dashboard ──', magenta);
  term.writeln('');
  const identical = repos.filter(r => r.diff_status === 'identical').length;
  const ahead = repos.filter(r => r.diff_status === 'local_ahead').length;
  const diverged = repos.filter(r => r.diff_status === 'diverged').length;
  const rate = repos.length > 0 ? (identical / repos.length * 100).toFixed(0) : 0;
  await typeLine('  synced repos:    ' + green(String(identical)) + ' / ' + repos.length + ' (' + yellow(rate + '%') + ')');
  await typeLine('  local ahead:     ' + yellow(String(ahead)));
  await typeLine('  diverged:        ' + red(String(diverged)));
  await typeLine('  activity events: ' + cyan(String(activities.length)));
  term.writeln('');
  const bar = (label, val, max, color) => {
    const w = 30;
    const filled = max > 0 ? Math.round(val / max * w) : 0;
    return '  ' + label.padEnd(14) + color('█'.repeat(filled)) + dim('░'.repeat(w - filled)) + ' ' + val;
  };
  const maxVal = Math.max(identical, ahead, diverged, 1);
  await typeLine(bar('identical', identical, maxVal, green));
  await typeLine(bar('local_ahead', ahead, maxVal, yellow));
  await typeLine(bar('diverged', diverged, maxVal, red));
  term.writeln('');
  await typeLine('  latest deletion: ' + (repos[repos.length - 1]?.folder_name || '—'));
  await typeLine('  last activity:  ' + (activities[activities.length - 1]?.timestamp || '—'));
  term.writeln('');
  autoScroll();
}

async function showWhoami() {
  term.writeln('');
  await typeLine('  ── whoami ──', magenta);
  term.writeln('');
  await typeLine('  runner:    ' + green('github-actions'));
  await typeLine('  vm:        ' + yellow('ubuntu-latest (linux x64)'));
  await typeLine('  shell:     ' + dim('bash'));
  await typeLine('  workflow:  ' + cyan('update-feed.yml'));
  await typeLine('  trigger:   ' + dim('schedule */30 * * * *'));
  await typeLine('  repo:      ' + blue('bonsai/new'));
  await typeLine('  branch:    ' + dim('gh-pages'));
  await typeLine('  scope:     ' + yellow('data.jsonl + log.jsonl'));
  await typeLine('  storage:   ' + dim('GH Pages (static)'));
  term.writeln('');
  await typeLine('  this terminal is driven by GH Actions VM');
  await typeLine('  data flows: repos.sqlite → data.jsonl → GH Pages → browser');
  term.writeln('');
  autoScroll();
}

// --- toolbar buttons ---
document.querySelectorAll('#toolbar .btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const cmd = btn.dataset.cmd;
    if (cmd === 'scope') await showScope();
    else if (cmd === 'repos') await showRepos();
    else if (cmd === 'activity') await showActivity();
    else if (cmd === 'dashboard') await showDashboard();
    else if (cmd === 'whoami') await showWhoami();
    else if (cmd === 'clear') term.clear();
  });
});

// --- tab switching ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

// --- interactive ---
let inputBuf = '';
let commandMode = false;

term.onData(async (data) => {
  if (commandMode) return;
  const code = data.charCodeAt(0);
  if (code === 13) {
    commandMode = true;
    term.writeln('');
    const cmd = inputBuf.trim();
    inputBuf = '';
    if (cmd === 's' || cmd === 'scope') await showScope();
    else if (cmd === 'r' || cmd === 'repos') await showRepos();
    else if (cmd === 'a' || cmd === 'activity') await showActivity();
    else if (cmd === 'd' || cmd === 'dashboard') await showDashboard();
    else if (cmd === 'w' || cmd === 'whoami') await showWhoami();
    else if (cmd === 'q' || cmd === 'quit') { await typeLine('  👋 bye', magenta); term.dispose(); return; }
    else if (cmd === 'clear' || cmd === 'c') term.clear();
    else if (cmd === 'help' || cmd === 'h') await typeLine('  [s]scope [r]repos [a]activity [d]dashboard [w]whoami [c]clear [q]quit');
    else if (cmd) await typeLine('  unknown: ' + cmd + '  (h for help)', red);
    term.write('  $ ');
    commandMode = false;
  } else if (code === 127) {
    if (inputBuf.length > 0) { inputBuf = inputBuf.slice(0, -1); term.write('\x1b[1D \x1b[1D'); }
  } else if (code >= 32 && code < 127) { inputBuf += data; term.write(data); }
});

setInterval(async () => { await fetchData(); }, 30000);

term.write('  $ ');
boot();
</script>
</body>
</html>
